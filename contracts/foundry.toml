[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
remappings = ["forge-std/=lib/forge-std/src/"]

fs_permissions = [{ access = "read", path = "./test" }]

[rpc_endpoints]
robinhood = "https://robinhood-rpc.publicnode.com"

[lint]
lint_on_build = false
